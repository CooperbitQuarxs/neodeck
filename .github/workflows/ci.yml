name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands. Keeps the
# matrix from queueing duplicate work during rapid push sequences.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Cross-platform matrix: typecheck + test + web build ──────────────────
  #
  # All three OSes run the same gates against the same Bun version. Anything
  # that diverges per-platform belongs in the source, not here — the matrix
  # exists to catch divergence early.
  matrix:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: bun install (frozen)
        run: bun install --frozen-lockfile

      # The server's program includes NeoPi's sources (tsconfig.neopi.json), and its tests load a
      # real NeoPi backend. scripts/neopi-setup.ts prepares the tree pinned in neopi.pin: frozen
      # install, a native addon built from the tree's own sources and verified against the version
      # sentinel, backend registration in NPI_DECK_HOME, and tsconfig.neopi.json. The source clone
      # and NPI_DECK_HOME live under RUNNER_TEMP so `bun test` never discovers NeoPi's own tests.
      - name: fetch NeoPi at neopi.pin
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < neopi.pin)"
          src="$RUNNER_TEMP/neopi-source"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/PsychedelicShayna/neopi.git
          git -C "$src" fetch -q --depth 1 origin "$pin"
          git -C "$src" checkout -q --detach FETCH_HEAD
          echo "NPI_DECK_NEOPI_SOURCE=$src" >> "$GITHUB_ENV"
          echo "NPI_DECK_HOME=$RUNNER_TEMP/npi-deck-home" >> "$GITHUB_ENV"

      # NeoPi's Swift bridge can select the newer Command Line Tools SDK even
      # when Xcode is the default. Use that same toolchain for the native linker.
      - name: select matching macOS compiler and SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcrun clang --version
          xcrun ld -v
          xcrun swiftc --version
          echo "SDKROOT=$sdk"

      - name: prepare NeoPi backend (install, native addon, tsconfig)
        run: bun scripts/neopi-setup.ts --build-native

      - name: typecheck (all workspaces)
        run: bun run typecheck

      - name: test (all workspaces)
        run: bun test

      - name: web build
        run: bun --cwd apps/web run build
